name: Playwright Tests
on:                     #EVENTS: The condition on which the test should be triggered
  push:                                   # On push to main or master branch it should trigger test
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]            # On pull to main or master branch it should trigger test
jobs:                           
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4         #actions are reusable set of jobs 
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
